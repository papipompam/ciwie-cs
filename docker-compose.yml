name: cowier-demo

services:
  # PostgreSQL 17 database for local development. Production uses Supabase.
  postgres:
    image: postgres:17-alpine
    container_name: cowier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ciwie_db}
      POSTGRES_USER: ${POSTGRES_USER:-ciwie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciwie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cowier-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: cowier-demo-migrate:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ciwie}:${POSTGRES_PASSWORD:-ciwie}@postgres:5432/${POSTGRES_DB:-ciwie_db}
      DIRECT_URL: postgresql://${POSTGRES_USER:-ciwie}:${POSTGRES_PASSWORD:-ciwie}@postgres:5432/${POSTGRES_DB:-ciwie_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cowier-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cowier-demo-app:local
    container_name: cowier-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ciwie}:${POSTGRES_PASSWORD:-ciwie}@postgres:5432/${POSTGRES_DB:-ciwie_db}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-change_this_to_at_least_32_characters_long_secret_key}
      INITIAL_ACCOUNT_PASSWORD: ${INITIAL_ACCOUNT_PASSWORD:-change_this_initial_account_password}
      FILE_STORAGE_ROOT: /app/.data/uploads
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - cowier-network
    volumes:
      - upload_data:/app/.data/uploads

volumes:
  postgres_data:
    name: cowier-demo_postgres_data
    driver: local
  upload_data:
    name: cowier-demo_upload_data
    driver: local

networks:
  cowier-network:
    driver: bridge
