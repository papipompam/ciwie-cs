services:
  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  db:
    ports: !reset []
    restart: unless-stopped
  storage:
    ports: !reset []
    restart: unless-stopped
  storage-init:
    security_opt:
      - no-new-privileges:true
  mailpit:
    profiles: ["development"]
  antivirus:
    restart: unless-stopped
  app:
    ports: !reset []
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  worker:
    restart: unless-stopped
    environment:
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required in production}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes: []
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  backup:
    environment:
      BACKUP_OFFSITE_REQUIRED: "true"
    security_opt:
      - no-new-privileges:true
  restore:
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
